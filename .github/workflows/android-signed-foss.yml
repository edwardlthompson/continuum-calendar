name: Android signed FOSS release

on:
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: Optional existing GitHub release tag to attach the signed APK
        required: false
        type: string

permissions:
  contents: write

jobs:
  foss-release:
    name: Android signed FOSS release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          python3 -c "import base64,os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'continuum-release.jks').write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))"
      - name: assembleFossRelease
        working-directory: apps/mobile
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/continuum-release.jks
        run: chmod +x gradlew && ./gradlew :app:assembleFossRelease --no-daemon
      - name: Remove keystore from runner
        if: always()
        run: rm -f "${{ runner.temp }}/continuum-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: continuum-calendar-foss-release
          path: apps/mobile/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Attach to GitHub Release
        if: inputs.attach_to_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.attach_to_tag }}" \
            apps/mobile/app/build/outputs/apk/foss/release/*.apk --clobber
