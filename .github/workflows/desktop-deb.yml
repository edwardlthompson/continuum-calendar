name: Desktop Deb

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deb:
    name: Linux Deb
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - run: npm ci
      - name: Build Debian package
        working-directory: apps/desktop
        run: npm run tauri:build && npm run rename:deb
      - uses: actions/upload-artifact@v7
        with:
          name: continuum-calendar-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/continuum-calendar_*_amd64.deb
          if-no-files-found: error
