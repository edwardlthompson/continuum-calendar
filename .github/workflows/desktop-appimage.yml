name: Desktop AppImage

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - run: npm ci
      - name: Build AppImage
        working-directory: apps/desktop
        run: npm run tauri:build && npm run rename:appimage
      - uses: actions/upload-artifact@v7
        with:
          name: continuum-calendar-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/Continuum-Calendar-*-x86_64.AppImage
          if-no-files-found: error
