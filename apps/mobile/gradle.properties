android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Android app version (F-Droid / Play). Independent of repo bootstrap tags (v2.1.0).
# Tag F-Droid releases as android-<VERSION_NAME> (see LICENSING.md / PR notes).
VERSION_NAME=1.0.0
VERSION_CODE=26
# Store / install id (Play, F-Droid, OAuth Android client package)
APP_ID=org.continuumcalendar.app
# AGP namespace + Kotlin R/BuildConfig — fork source tree stays under org.fossify.calendar
SOURCE_NAMESPACE=org.fossify.calendar
